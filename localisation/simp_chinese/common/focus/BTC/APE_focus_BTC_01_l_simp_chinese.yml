 BTC_01_FS_04_A: "控制金融设施"
 BTC_01_FS_04_A_desc: "“工人阶级不能简单地掌握现成的国家机器,并运用它来达到自己的目的。”\n罢工余烬未冷，各厂纠察队即按预定方案分赴银行、金库与票据交换所。各厂财务委员携带工团印封，同步进驻全境的银行支行与结算中心。\n金库钥匙交由车间选举产生的三人委员会共同保管，全部账簿逐页加盖工团审计专用印鉴。任何对外支付款项，均须附有工厂工会的联署票据方予执行。此项行动意在将货币流通与信贷分配纳入劳动纪律的监督之下。\n随着金融节点相继纳入管辖，资金调配权限便由伦敦方面的旧有机构，平稳转移至各生产单位推选的代表手中。"

 BTC_01_FS_04_B: "组建工人纠察队"
 BTC_01_FS_04_B_desc: "罢工的工人骨干正式佩带红臂章，登记造册，按车间编成队伍。武器不是配发的——是从溃兵手中收缴的步枪，是车床边改装的护甲，更是斗争中淬炼出的铁的纪律。\n队员仍不脱离生产，轮值上岗，薪饷由工会按熟练技工标准给付。军官由士兵举手表决产生，不合格者可随时罢免。\n这支队伍，不叫军队，却比旧军队更清楚为何而战。因为他们守卫的不是铁丝网后的边界，而是身后轰鸣的织机、不灭的熔炉，以及车间黑板上每日更新的配给名单。公社没有常备军，但每一个戴红臂章的工友，都是一座移动的堡垒。"

 BTC_01_FS_04_C: "控制生产设施"
 BTC_01_FS_04_C_desc: "‌“工人必须通过运动和行动获得法律和政治能力。它的首要行为准则应该是：保持纯粹的工人……”‌‌‌\n如果说组织工会是让旧秩序停转，控制生产设施便是让新秩序开工。\n汽笛沉寂许久后再度拉响，但这次，启动马达的不是工头老板，而是各车间选举产生的管理委员会。矿山、纺织厂与机械工场正式移交工团。每一台机床、每一座高炉、每一台发电机组均归入管理，由专门的工人代表签字接收。\n从此，机器的轰鸣不再为股东的红利，而是为公社的粮仓、熔炉与学校。这不是占领，是夺回属于自己的东西。"

 BTC_01_FS_06_A: "清查非法资产"
 BTC_01_FS_06_A_desc: "“‌必须摧毁金钱的力量……”‌——费尔南·佩卢蒂埃\n各厂财务委员协同工人纠察队，依据账簿排查与群众举报，逐一查封旧官僚、投机商及敌方合作者的仓储物资与隐匿资金。囤积的粮食、布匹、煤炭与药品登记造册后，转入公社配给总库统一调度。\n不在于报复，而在于切断一切寄生链条，让战争机器与黑市的血脉同步枯竭。此举为公社构筑了最初的物质地基——每一袋粮食都归于喂养劳动者的碗碟，每一块煤炭都重新滚向熔炉与暖气管。清算之后，北方的物资源终于尽数归于流汗的人。"

 BTC_01_FS_06_B: "镇压反革命"
 BTC_01_FS_06_B_desc: "罢工让旧世界的钟摆停走，于是叛卖者的脚步在静默中格外刺耳。\n各厂财务委员在核查账簿过程中发现的资产转移线索，与工人纠察队收集的群众检举材料相互印证，锁定趁乱破坏机器、侵吞公社物资及为敌方传递情报人员的名单。\n工人法庭在厂房设立，依临时治安条款逐案审理，被告人有权自辩，判决由车间选举的陪审员表决通过。\n随着内部隐患被清理，公社的脊梁不再藏纳暗刺。\n“我们必须清扫屋子，把那些混进我们队伍里的敌人、特务、破坏分子……统统清除出去。”"

 BTC_01_FS_06_C: "全国总动员"
 BTC_01_FS_06_C_desc: "‌“社会战争，通过诉诸在任何有组织的军队中自然发展的荣誉，可以消除道德无能为力的丑陋情绪。”\n各厂委员会依据车间名册，将每一个在岗工人编入双重序列——\n第一序列是生产班组，继续维持机床运转、煤层开采与锅炉燃烧；\n第二序列是地域民兵，轮值构筑城防工事、抢修铁路支线、在北方边境的丘陵地带开挖反装甲壕沟。\n通过“武装每一个拒绝再当奴隶的劳动者”，日常生产与战时防卫不再是两张皮，而是同一座熔炉里锻出的同一块钢。最后，每一座高炉都是熔铸决心的坩埚，每一条战壕都成为车间延伸出去的前沿。"

